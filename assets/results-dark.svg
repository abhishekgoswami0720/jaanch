<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="488" viewBox="0 0 1000 488" fill="none" role="img" aria-labelledby="t"><title id="t">Risk scores for six sample messages</title><style>.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}@keyframes bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}.bar{transform-box:fill-box;transform-origin:left;animation:bar 1s cubic-bezier(.2,.7,.2,1) both}@keyframes fade{from{opacity:0}to{opacity:1}}.fade{animation:fade .5s ease-out both}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><clipPath id="fr"><rect width="1000" height="488" rx="18"/></clipPath></defs><rect x=".5" y=".5" width="999" height="487" rx="18" fill="#0f1420" stroke="#263043"/><text class="s" x="40" y="46" font-size="19" font-weight="700" fill="#e8edf4">What Jaanch said about 6 test messages</text><text class="s" x="40" y="70" font-size="13.5" fill="#9ca8ba">risk score out of 10 · longer bar = more dangerous</text><line x1="382.0" y1="90" x2="382.0" y2="464" stroke="#263043" stroke-dasharray="3 5"/><text class="m" x="382.0" y="480" font-size="11" fill="#64718a" text-anchor="middle">1</text><line x1="538.0" y1="90" x2="538.0" y2="464" stroke="#263043" stroke-dasharray="3 5"/><text class="m" x="538.0" y="480" font-size="11" fill="#64718a" text-anchor="middle">4</text><line x1="694.0" y1="90" x2="694.0" y2="464" stroke="#263043" stroke-dasharray="3 5"/><text class="m" x="694.0" y="480" font-size="11" fill="#64718a" text-anchor="middle">7</text><line x1="850.0" y1="90" x2="850.0" y2="464" stroke="#263043" stroke-dasharray="3 5"/><text class="m" x="850.0" y="480" font-size="11" fill="#64718a" text-anchor="middle">10</text><text class="s" x="40" y="118" font-size="15" font-weight="650" fill="#e8edf4">Fake Infosys email</text><text class="s" x="40" y="138" font-size="12.5" fill="#64718a">lookalike website, 11 days old, asks for a deposit</text><rect x="330" y="108" width="520" height="26" rx="7" fill="#161d2b"/><rect class="bar" x="330" y="108" width="520.0" height="26" rx="7" fill="#ef4444" style="animation-delay:0.20s"/><text class="s fade" x="866" y="127" font-size="18" font-weight="800" fill="#ef4444" style="animation-delay:0.70s">10</text><text class="s fade" x="894" y="127" font-size="13" fill="#9ca8ba" style="animation-delay:0.70s">High risk</text><text class="s" x="40" y="180" font-size="15" font-weight="650" fill="#e8edf4">Fake TCS WhatsApp</text><text class="s" x="40" y="200" font-size="12.5" fill="#64718a">asks for a ₹1,499 fee, Gmail address, Telegram</text><rect x="330" y="170" width="520" height="26" rx="7" fill="#161d2b"/><rect class="bar" x="330" y="170" width="520.0" height="26" rx="7" fill="#ef4444" style="animation-delay:0.32s"/><text class="s fade" x="866" y="189" font-size="18" font-weight="800" fill="#ef4444" style="animation-delay:0.82s">10</text><text class="s fade" x="894" y="189" font-size="13" fill="#9ca8ba" style="animation-delay:0.82s">High risk</text><text class="s" x="40" y="242" font-size="15" font-weight="650" fill="#e8edf4">Hinglish “task” scam</text><text class="s" x="40" y="262" font-size="12.5" fill="#64718a">paid likes and reviews, unreal daily pay</text><rect x="330" y="232" width="520" height="26" rx="7" fill="#161d2b"/><rect class="bar" x="330" y="232" width="520.0" height="26" rx="7" fill="#ef4444" style="animation-delay:0.44s"/><text class="s fade" x="866" y="251" font-size="18" font-weight="800" fill="#ef4444" style="animation-delay:0.94s">10</text><text class="s fade" x="894" y="251" font-size="13" fill="#9ca8ba" style="animation-delay:0.94s">High risk</text><text class="s" x="40" y="304" font-size="15" font-weight="650" fill="#e8edf4">New startup offer</text><text class="s" x="40" y="324" font-size="12.5" fill="#64718a">4-month-old website, 24-hour pressure</text><rect x="330" y="294" width="520" height="26" rx="7" fill="#161d2b"/><rect class="bar" x="330" y="294" width="260.0" height="26" rx="7" fill="#f59e0b" style="animation-delay:0.56s"/><text class="s fade" x="866" y="313" font-size="18" font-weight="800" fill="#f59e0b" style="animation-delay:1.06s">5</text><text class="s fade" x="894" y="313" font-size="13" fill="#9ca8ba" style="animation-delay:1.06s">Suspicious</text><text class="s" x="40" y="366" font-size="15" font-weight="650" fill="#e8edf4">Internshala listing</text><text class="s" x="40" y="386" font-size="12.5" fill="#64718a">website active since 2010</text><rect x="330" y="356" width="520" height="26" rx="7" fill="#161d2b"/><rect class="bar" x="330" y="356" width="52.0" height="26" rx="7" fill="#22c55e" style="animation-delay:0.68s"/><text class="s fade" x="866" y="375" font-size="18" font-weight="800" fill="#22c55e" style="animation-delay:1.18s">1</text><text class="s fade" x="894" y="375" font-size="13" fill="#9ca8ba" style="animation-delay:1.18s">Low risk</text><text class="s" x="40" y="428" font-size="15" font-weight="650" fill="#e8edf4">Campus offer from Zoho</text><text class="s" x="40" y="448" font-size="12.5" fill="#64718a">official email, company since 1996</text><rect x="330" y="418" width="520" height="26" rx="7" fill="#161d2b"/><rect class="bar" x="330" y="418" width="52.0" height="26" rx="7" fill="#22c55e" style="animation-delay:0.80s"/><text class="s fade" x="866" y="437" font-size="18" font-weight="800" fill="#22c55e" style="animation-delay:1.30s">1</text><text class="s fade" x="894" y="437" font-size="13" fill="#9ca8ba" style="animation-delay:1.30s">Low risk</text></svg>