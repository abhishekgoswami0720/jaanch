<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="200" viewBox="0 0 1000 200" fill="none" role="img" aria-labelledby="t"><title id="t">Risk score scale: 1-3 low risk, 4-6 suspicious, 7-10 high risk</title><style>.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}@keyframes cell{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.cell{animation:cell .45s ease-out both}@keyframes fade{from{opacity:0}to{opacity:1}}.fade{animation:fade .6s ease-out both}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><clipPath id="fr"><rect width="1000" height="200" rx="18"/></clipPath></defs><rect x=".5" y=".5" width="999" height="199" rx="18" fill="#0f1420" stroke="#263043"/><g class="cell" style="animation-delay:0.07s"><rect x="63.0" y="92" width="82.0" height="36" rx="8" fill="#22c55e" fill-opacity="0.41"/><text class="s" x="104.0" y="116" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">1</text></g><g class="cell" style="animation-delay:0.14s"><rect x="151.0" y="92" width="82.0" height="36" rx="8" fill="#22c55e" fill-opacity="0.47"/><text class="s" x="192.0" y="116" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">2</text></g><g class="cell" style="animation-delay:0.21s"><rect x="239.0" y="92" width="82.0" height="36" rx="8" fill="#22c55e" fill-opacity="0.53"/><text class="s" x="280.0" y="116" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">3</text></g><g class="cell" style="animation-delay:0.28s"><rect x="327.0" y="92" width="82.0" height="36" rx="8" fill="#f59e0b" fill-opacity="0.59"/><text class="s" x="368.0" y="116" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">4</text></g><g class="cell" style="animation-delay:0.35s"><rect x="415.0" y="92" width="82.0" height="36" rx="8" fill="#f59e0b" fill-opacity="0.65"/><text class="s" x="456.0" y="116" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">5</text></g><g class="cell" style="animation-delay:0.42s"><rect x="503.0" y="92" width="82.0" height="36" rx="8" fill="#f59e0b" fill-opacity="0.71"/><text class="s" x="544.0" y="116" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">6</text></g><g class="cell" style="animation-delay:0.49s"><rect x="591.0" y="92" width="82.0" height="36" rx="8" fill="#ef4444" fill-opacity="0.77"/><text class="s" x="632.0" y="116" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">7</text></g><g class="cell" style="animation-delay:0.56s"><rect x="679.0" y="92" width="82.0" height="36" rx="8" fill="#ef4444" fill-opacity="0.83"/><text class="s" x="720.0" y="116" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">8</text></g><g class="cell" style="animation-delay:0.63s"><rect x="767.0" y="92" width="82.0" height="36" rx="8" fill="#ef4444" fill-opacity="0.89"/><text class="s" x="808.0" y="116" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">9</text></g><g class="cell" style="animation-delay:0.70s"><rect x="855.0" y="92" width="82.0" height="36" rx="8" fill="#ef4444" fill-opacity="0.95"/><text class="s" x="896.0" y="116" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">10</text></g><g class="fade" style="animation-delay:0.90s"><path d="M63.0,78 V72 H321.0 V78" stroke="#22c55e" stroke-width="2" fill="none"/><text class="s" x="192.0" y="60" font-size="16" font-weight="700" fill="#22c55e" text-anchor="middle">Low risk</text><text class="s" x="192.0" y="158" font-size="14" fill="#9ca8ba" text-anchor="middle">No strong scam signs</text></g><g class="fade" style="animation-delay:1.05s"><path d="M327.0,78 V72 H585.0 V78" stroke="#f59e0b" stroke-width="2" fill="none"/><text class="s" x="456.0" y="60" font-size="16" font-weight="700" fill="#f59e0b" text-anchor="middle">Suspicious</text><text class="s" x="456.0" y="158" font-size="14" fill="#9ca8ba" text-anchor="middle">Check before you pay or share</text></g><g class="fade" style="animation-delay:1.20s"><path d="M591.0,78 V72 H937.0 V78" stroke="#ef4444" stroke-width="2" fill="none"/><text class="s" x="764.0" y="60" font-size="16" font-weight="700" fill="#ef4444" text-anchor="middle">High risk</text><text class="s" x="764.0" y="158" font-size="14" fill="#9ca8ba" text-anchor="middle">Looks like a scam</text></g><text class="m" x="500.0" y="184" font-size="12" fill="#64718a" text-anchor="middle">score = 2 + points from the evidence, kept between 1 and 10</text></svg>