<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="530" viewBox="0 0 1000 530" fill="none" role="img" aria-labelledby="t"><title id="t">Fake Infosys email: 17 points, capped at 10 out of 10</title><style>.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}@keyframes bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}.bar{transform-box:fill-box;transform-origin:left;animation:bar .8s cubic-bezier(.2,.7,.2,1) both}@keyframes fade{from{opacity:0}to{opacity:1}}.fade{animation:fade .5s ease-out both}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><clipPath id="fr"><rect width="1000" height="530" rx="18"/></clipPath></defs><rect x=".5" y=".5" width="999" height="529" rx="18" fill="#0f1420" stroke="#263043"/><text class="s" x="40" y="46" font-size="19" font-weight="700" fill="#e8edf4">Fake Infosys email: where the score came from</text><text class="s" x="40" y="70" font-size="13.5" fill="#9ca8ba">each warning sign adds points</text><text class="s" x="40" y="115" font-size="14.5" fill="#9ca8ba">Every offer starts with</text><rect class="bar" x="380" y="101" width="235.0" height="20" rx="5" fill="#64718a" style="animation-delay:0.15s"/><text class="m fade" x="627.0" y="116" font-size="13.5" font-weight="700" fill="#64718a" style="animation-delay:0.55s">2</text><text class="s" x="40" y="155" font-size="14.5" fill="#e8edf4">Asks for a ₹4,500 deposit</text><rect class="bar" x="380" y="141" width="470.0" height="20" rx="5" fill="#ef4444" style="animation-delay:0.25s"/><text class="m fade" x="862.0" y="156" font-size="13.5" font-weight="700" fill="#ef4444" style="animation-delay:0.65s">+4</text><text class="s" x="40" y="195" font-size="14.5" fill="#e8edf4">Website copies the Infosys name</text><rect class="bar" x="380" y="181" width="352.5" height="20" rx="5" fill="#ef4444" style="animation-delay:0.35s"/><text class="m fade" x="744.5" y="196" font-size="13.5" font-weight="700" fill="#ef4444" style="animation-delay:0.75s">+3</text><text class="s" x="40" y="235" font-size="14.5" fill="#e8edf4">Website made only 11 days ago</text><rect class="bar" x="380" y="221" width="352.5" height="20" rx="5" fill="#ef4444" style="animation-delay:0.45s"/><text class="m fade" x="744.5" y="236" font-size="13.5" font-weight="700" fill="#ef4444" style="animation-delay:0.85s">+3</text><text class="s" x="40" y="275" font-size="14.5" fill="#e8edf4">Its email address can&#x27;t receive mail</text><rect class="bar" x="380" y="261" width="176.2" height="20" rx="5" fill="#f59e0b" style="animation-delay:0.55s"/><text class="m fade" x="568.2" y="276" font-size="13.5" font-weight="700" fill="#f59e0b" style="animation-delay:0.95s">+1.5</text><text class="s" x="40" y="315" font-size="14.5" fill="#e8edf4">Wants Aadhaar, PAN and bank details</text><rect class="bar" x="380" y="301" width="117.5" height="20" rx="5" fill="#f59e0b" style="animation-delay:0.65s"/><text class="m fade" x="509.5" y="316" font-size="13.5" font-weight="700" fill="#f59e0b" style="animation-delay:1.05s">+1</text><text class="s" x="40" y="355" font-size="14.5" fill="#e8edf4">&quot;within 48 hours&quot; pressure</text><rect class="bar" x="380" y="341" width="117.5" height="20" rx="5" fill="#f59e0b" style="animation-delay:0.75s"/><text class="m fade" x="509.5" y="356" font-size="13.5" font-weight="700" fill="#f59e0b" style="animation-delay:1.15s">+1</text><text class="s" x="40" y="395" font-size="14.5" fill="#e8edf4">Hides the payment page behind bit.ly</text><rect class="bar" x="380" y="381" width="117.5" height="20" rx="5" fill="#f59e0b" style="animation-delay:0.85s"/><text class="m fade" x="509.5" y="396" font-size="13.5" font-weight="700" fill="#f59e0b" style="animation-delay:1.25s">+1</text><text class="s" x="40" y="435" font-size="14.5" fill="#e8edf4">&quot;Dear Applicant&quot; instead of your name</text><rect class="bar" x="380" y="421" width="58.8" height="20" rx="5" fill="#f59e0b" style="animation-delay:0.95s"/><text class="m fade" x="450.8" y="436" font-size="13.5" font-weight="700" fill="#f59e0b" style="animation-delay:1.35s">+0.5</text><line x1="40" y1="470" x2="960" y2="470" stroke="#263043"/><text class="s fade" x="40" y="506" font-size="16" fill="#e8edf4" style="animation-delay:1.2s">Total: <tspan font-weight="700">17 points</tspan><tspan fill="#9ca8ba">, more than the maximum, so the score is capped at</tspan></text><g class="fade" style="animation-delay:1.4s"><rect x="822" y="482" width="138" height="36" rx="10" fill="#ef4444"/><text class="s" x="891" y="506" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">10 · high risk</text></g></svg>